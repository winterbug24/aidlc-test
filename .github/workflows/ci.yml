name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # 액션은 태그가 아니라 커밋 SHA로 고정한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: python -m pip install -r requirements-dev.txt

      - name: 테스트 (예제 기반 + 속성 기반)
        # 시드를 로그에 남겨 실패를 같은 값으로 재현할 수 있게 한다.
        run: |
          echo "Hypothesis seed: ${GITHUB_RUN_ID}"
          python -m pytest --hypothesis-seed="${GITHUB_RUN_ID}"

      - name: 의존성 취약점 스캔
        run: python -m pip_audit -r requirements-dev.txt --no-deps --disable-pip
