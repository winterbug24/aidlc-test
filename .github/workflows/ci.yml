name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 액션은 태그가 아니라 커밋 SHA로 고정한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: python -m pip install -r requirements-dev.txt

      - name: 브라우저 설치 (화면 테스트용 Chromium)
        # 브라우저 빌드는 고정된 playwright 버전이 정한다.
        run: python -m playwright install --with-deps chromium

      - name: 테스트 (예제 기반 + 속성 기반 + 화면)
        # 시드를 로그에 남겨 실패를 같은 값으로 재현할 수 있게 한다.
        run: |
          echo "Hypothesis seed: ${GITHUB_RUN_ID}"
          python -m pytest --hypothesis-seed="${GITHUB_RUN_ID}" --tracing=retain-on-failure --output=test-results

      - name: 화면 테스트 실패 자료 보관
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: 의존성 취약점 스캔
        run: python -m pip_audit -r requirements-dev.txt --no-deps --disable-pip
